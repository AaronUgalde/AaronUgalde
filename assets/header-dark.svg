<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Aarón Ugalde. A transit line through ESCOM, the algorithms club, hackathons and Udemy, continuing to the next stop.">
  <style>
    .name { font: 700 30px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .role { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .lab  { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub  { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .next { font: italic 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .train { animation: ride 9s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes ride {
      0%       { transform: translateX(0); opacity: 0; }
      4%       { opacity: 1; }
      8%, 14%  { transform: translateX(30px); }
      28%, 36% { transform: translateX(210px); }
      50%, 58% { transform: translateX(390px); }
      72%, 94% { transform: translateX(570px); opacity: 1; }
      100%     { transform: translateX(570px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .train { animation: none; } }
  </style>
  <rect width="900" height="240" rx="12" fill="#0d1117"/>
  <text x="40" y="48" class="name">Aarón Ugalde</text>
  <text x="40" y="72" class="role">backend · data · applied ML — Mexico City</text>
  <line x1="30" y1="150" x2="610" y2="150" stroke="#e9468f" stroke-width="10" stroke-linecap="round"/>
  <line x1="610" y1="150" x2="820" y2="150" stroke="#30363d" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 16"/>
  <circle cx="70" cy="150" r="10" fill="#0d1117" stroke="#e9468f" stroke-width="5"/><text x="70" y="104" text-anchor="middle" class="lab">ESCOM</text><text x="70" y="122" text-anchor="middle" class="sub">IPN · AI Eng.</text><circle cx="250" cy="150" r="10" fill="#0d1117" stroke="#e9468f" stroke-width="5"/><text x="250" y="186" text-anchor="middle" class="lab">Algoritmia</text><text x="250" y="204" text-anchor="middle" class="sub">ICPC · teaching</text><circle cx="430" cy="150" r="10" fill="#0d1117" stroke="#e9468f" stroke-width="5"/><text x="430" y="104" text-anchor="middle" class="lab">Hackathons</text><text x="430" y="122" text-anchor="middle" class="sub">Siemens · IBM · +2</text><circle cx="610" cy="150" r="13" fill="#0d1117" stroke="#e6edf3" stroke-width="4"/><circle cx="610" cy="150" r="5" fill="#e6edf3"/><text x="610" y="186" text-anchor="middle" class="lab">Udemy</text><text x="610" y="204" text-anchor="middle" class="sub">DS intern · 2026</text>
  <g class="train"><rect x="28" y="141" width="24" height="18" rx="6" fill="#e6edf3"/><rect x="33" y="145" width="5" height="5" rx="1" fill="#0d1117"/><rect x="42" y="145" width="5" height="5" rx="1" fill="#0d1117"/></g>
  <circle cx="820" cy="150" r="10" fill="#0d1117" stroke="#30363d" stroke-width="5" stroke-dasharray="4 4"/>
  <text x="820" y="104" text-anchor="middle" class="lab" fill-opacity=".6">próxima estación</text>
  <text x="820" y="186" text-anchor="middle" class="next">next stop</text>
</svg>
