<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Aarón Ugalde — Software Engineer · Backend &amp; Data">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="900" height="200" rx="14"/></clipPath>
  </defs>
  <style>
    .t { font: 700 44px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    .fade { animation: in .9s ease-out .2s both; }
    .fade2 { animation: in .9s ease-out .7s both; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .cur, .fade, .fade2 { animation: none; } }
  </style>
  <rect width="900" height="200" rx="14" fill="#ffffff"/>
  <rect width="900" height="200" rx="14" fill="url(#grid)"/>
  <rect x="0" y="194" width="900" height="6" fill="url(#g)" clip-path="url(#r)"/>
  <g class="fade"><text x="48" y="92" class="t">Aarón Ugalde</text></g>
  <g class="fade2">
    <text x="50" y="134" class="s"><tspan fill="url(#g)">$</tspan> software engineer · backend &amp; data infra · ICPC<tspan class="cur" dx="8" fill="#0969da">▍</tspan></text>
  </g>
  <g transform="translate(760 100)" opacity=".9">
    <circle r="56" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="12" text-anchor="middle" style="font: 700 34px ui-monospace, Menlo, monospace" fill="url(#g)">{ }</text>
  </g>
</svg>
